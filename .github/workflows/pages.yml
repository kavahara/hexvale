# Публикация сайта: наружу уходят только файлы сайта, без README, scripts/ и служебных файлов.
# Работает после переключения Settings → Pages → Source на «GitHub Actions»; до этого сайт
# по-прежнему раздаётся из корня main, а этот процесс падает на шаге deploy, ничего не трогая.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        run: python3 scripts/check_links.py

      - name: Collect public files
        run: |
          mkdir _site
          git ls-files -z \
            | grep -zvE '^(scripts/|\.github/)|^\.|\.md$' \
            | xargs -0 cp --parents -t _site
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
